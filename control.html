<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放學集合 - 老師控制台 (iPad)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; padding-bottom: 80px; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { margin: 0; color: #1a1a1a; font-size: 1.8rem; }
        .header p { color: #666; margin-top: 5px; }
        
        /* 5 行區域容器 */
        .rows-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 每行 Flex 排版 */
        .grade-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .class-btn {
            flex: 1;
            padding: 20px 5px;
            font-size: 1.7rem;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 12px;
            background: white;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .class-btn.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
            transform: scale(0.98);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* 縮小並固定在左下角的重設按鈕 */
        .btn-clear-bottom-left {
            position: fixed;
            left: 15px;
            bottom: 15px;
            padding: 8px 15px;
            font-size: 0.85rem;
            background: #6c757d; /* 改用不顯眼的灰色 */
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 999;
        }
        .btn-clear-bottom-left:active {
            opacity: 1;
            background: #dc3545; /* 點擊時才顯現紅色 */
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>《放學報班系統》控制台（地下有蓋操場）</h2>
        <p>點擊班別即可即時廣播發布 / 取消</p>
    </div>

    <div id="rowsContainer" class="rows-container"></div>

    <!-- 移至左下角的防誤觸重設按鈕 -->
    <button class="btn-clear-bottom-left" onclick="clearAllData()">重設 / 清空所有班別</button>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ⚠️ 請填入與 index.html 完全相同的 firebaseConfig 金鑰
const firebaseConfig = {
  apiKey: "AIzaSyBSdMpO9W9iLYGdjeqpghx5M50EQriIIHE",
  authDomain: "school-dismissal-c4251.firebaseapp.com",
  databaseURL: "https://school-dismissal-c4251-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "school-dismissal-c4251",
  storageBucket: "school-dismissal-c4251.firebasestorage.app",
  messagingSenderId: "610659127496",
  appId: "1:610659127496:web:67b53b52ffa2183bf5d5fd",
  measurementId: "G-ET6JXWYSLN"
};

        const classRows = [
            ["1信", "1望", "2信", "2望"],
            ["3信", "3望"],
            ["4信", "4望", "4愛"],
            ["5信", "5望", "5愛", "5勤"],
            ["6信", "6望", "6愛", "6勤"]
        ];

        let activeClasses = {};
        let statusRef = null;

        function renderButtons() {
            const container = document.getElementById('rowsContainer');
            container.innerHTML = '';

            classRows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grade-row';

                row.forEach(cls => {
                    const btn = document.createElement('button');
                    btn.className = `class-btn ${activeClasses[cls] ? 'active' : ''}`;
                    btn.innerText = cls;
                    btn.onclick = () => toggleClass(cls);
                    rowDiv.appendChild(btn);
                });

                container.appendChild(rowDiv);
            });
        }

        function toggleClass(cls) {
            if (activeClasses[cls]) {
                delete activeClasses[cls];
            } else {
                activeClasses[cls] = true;
            }
            renderButtons();

            if (statusRef) {
                statusRef.set(activeClasses);
            }
        }

        function clearAllData() {
            if (confirm("⚠️ 警告：確定要清空所有已發布的班別嗎？")) {
                activeClasses = {};
                renderButtons();
                if (statusRef) {
                    statusRef.set({});
                }
            }
        }

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                statusRef = db.ref('dismissal/arrivedClasses');

                statusRef.on('value', (snapshot) => {
                    activeClasses = snapshot.val() || {};
                    renderButtons();
                });
            }
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
        }

        renderButtons();
    </script>
</body>
</html>
