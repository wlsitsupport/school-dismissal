<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《放學報班系統》 - 老師控制台 (iPad)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 90px;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { margin: 0; color: #1e3a8a; font-size: 2rem; } /* 標題改為深藍色 */
        .header p { color: #475569; margin-top: 8px; font-size: 1.1rem; }
        
        /* 5 行區域容器：加大垂直行距 */
        .rows-container {
            max-width: 950px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px; 
        }

        /* 每行 Flex 排版：加大橫向按鈕間距 */
        .grade-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            width: 100%;
        }

        /* 按鈕預設樣式（未選取：白底灰框） */
        .class-btn {
            flex: 1;
            padding: 26px 10px;
            font-size: 1.9rem;
            font-weight: bold;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            transition: all 0.15s ease-in-out;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* iPad 觸控按下時的反應 */
        .class-btn:active {
            transform: scale(0.95);
            background: #e2e8f0;
        }

        /* 🟦 已選取（改用深藍/寶藍色）狀態 */
        .class-btn.active {
            background: linear-gradient(145deg, #1d4ed8, #2563eb); /* 寶藍色漸層 */
            color: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4); /* 藍色陰影 */
            transform: scale(1.02);
        }

        /* 固定在左下角的防誤觸重設按鈕 */
        .btn-clear-bottom-left {
            position: fixed;
            left: 20px;
            bottom: 20px;
            padding: 10px 18px;
            font-size: 0.9rem;
            background: #64748b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.75;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            z-index: 999;
        }
        .btn-clear-bottom-left:active {
            opacity: 1;
            background: #ef4444;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>《放學報班系統》控制台（地下有蓋操場）</h2>
        <p>點擊班別即可即時廣播發布 / 取消</p>
    </div>

    <div id="rowsContainer" class="rows-container"></div>

    <!-- 左下角的防誤觸重設按鈕 -->
    <button class="btn-clear-bottom-left" onclick="clearAllData()">重設 / 清空所有班別</button>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ⚠️ 請填入與 index.html 完全相同的 firebaseConfig 金鑰
const firebaseConfig = {
  apiKey: "AIzaSyBSdMpO9W9iLYGdjeqpghx5M50EQriIIHE",
  authDomain: "school-dismissal-c4251.firebaseapp.com",
  databaseURL: "https://school-dismissal-c4251-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "school-dismissal-c4251",
  storageBucket: "school-dismissal-c4251.firebasestorage.app",
  messagingSenderId: "610659127496",
  appId: "1:610659127496:web:67b53b52ffa2183bf5d5fd",
  measurementId: "G-ET6JXWYSLN"
};

        const classRows = [
            ["1信", "1望", "2信", "2望"],
            ["3信", "3望"],
            ["4信", "4望", "4愛"],
            ["5信", "5望", "5愛", "5勤"],
            ["6信", "6望", "6愛", "6勤"]
        ];

        let activeClasses = {};
        let statusRef = null;

        function renderButtons() {
            const container = document.getElementById('rowsContainer');
            container.innerHTML = '';

            classRows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grade-row';

                row.forEach(cls => {
                    const btn = document.createElement('button');
                    btn.className = `class-btn ${activeClasses[cls] ? 'active' : ''}`;
                    btn.innerText = cls;
                    btn.onclick = () => toggleClass(cls);
                    rowDiv.appendChild(btn);
                });

                container.appendChild(rowDiv);
            });
        }

        function toggleClass(cls) {
            if (activeClasses[cls]) {
                delete activeClasses[cls];
            } else {
                activeClasses[cls] = true;
            }
            renderButtons();

            if (statusRef) {
                statusRef.set(activeClasses);
            }
        }

        function clearAllData() {
            if (confirm("⚠️ 警告：確定要清空所有已發布的班別嗎？")) {
                activeClasses = {};
                renderButtons();
                if (statusRef) {
                    statusRef.set({});
                }
            }
        }

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                statusRef = db.ref('dismissal/arrivedClasses');

                statusRef.on('value', (snapshot) => {
                    activeClasses = snapshot.val() || {};
                    renderButtons();
                });
            }
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
        }

        renderButtons();
    </script>
</body>
</html>
