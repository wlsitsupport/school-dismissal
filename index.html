<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地下有蓋操場 - 放學班別即時顯示 (9:16 直向)</title>
    <style>
        /* 設定 9:16 直向滿版版面 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 隱藏滾動條，確保畫面完美鎖定 */
            background-color: #0f172a;
            color: #ffffff;
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4vh 3vw;
            box-sizing: border-box;
        }

        /* 頂部標題區 (佔用直向螢幕上方空間) */
        .header {
            text-align: center;
            width: 100%;
            margin-bottom: 1vh;
        }
        h1 {
            font-size: 3.5vw;
            margin: 0;
            color: #facc15;
            letter-spacing: 2px;
            font-weight: 900;
        }
        .subtitle {
            font-size: 2vw;
            color: #38bdf8;
            margin-top: 1vh;
            font-weight: bold;
        }
        
        /* 5 行區域容器：均勻垂直分佈 */
        .rows-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around; /* 每行平均等分高度 */
            gap: 1.5vh;
            margin-top: 2vh;
        }

        /* 每行 Flex 橫向等分排版 */
        .grade-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2vw;
            width: 100%;
            height: 16%; /* 確保 5 行垂直高度一致 */
        }

        /* 班別卡片基礎樣式 */
        .class-card {
            flex: 1; /* 每行內的班別平均分配寬度 */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 2vh;
            font-size: 4vw; /* 針對直向大螢幕優化的超大字體 */
            font-weight: 900;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }

        /* 未到達：暗灰色 */
        .class-card.pending {
            background-color: #1e293b;
            border: 0.4vh solid #334155;
            color: #475569;
            opacity: 0.6;
        }

        /* 已到達：高亮亮綠色 */
        .class-card.arrived {
            background: linear-gradient(145deg, #15803d, #22c55e);
            border: 0.4vh solid #86efac;
            color: #ffffff;
            opacity: 1;
            transform: scale(1.03);
            box-shadow: 0 1vh 3vh rgba(34, 197, 94, 0.5);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>放學集合 (地下有蓋操場)</h1>
        <div class="subtitle">綠色代表班別已到達操場</div>
    </div>

    <div id="rowsContainer" class="rows-container"></div>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ⚠️ 請填入您的 firebaseConfig 金鑰
const firebaseConfig = {
  apiKey: "AIzaSyBSdMpO9W9iLYGdjeqpghx5M50EQriIIHE",
  authDomain: "school-dismissal-c4251.firebaseapp.com",
  databaseURL: "https://school-dismissal-c4251-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "school-dismissal-c4251",
  storageBucket: "school-dismissal-c4251.firebasestorage.app",
  messagingSenderId: "610659127496",
  appId: "1:610659127496:web:67b53b52ffa2183bf5d5fd",
  measurementId: "G-ET6JXWYSLN"
};

        // 指定 5 行排列班別結構
        const classRows = [
            ["1信", "1望", "2信", "2望"],
            ["3信", "3望"],
            ["4信", "4望", "4愛"],
            ["5信", "5望", "5愛", "5勤"],
            ["6信", "6望", "6愛", "6勤"]
        ];

        let arrivedClasses = {};

        function renderDisplay() {
            const container = document.getElementById('rowsContainer');
            container.innerHTML = '';

            classRows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grade-row';

                row.forEach(cls => {
                    const card = document.createElement('div');
                    const isArrived = arrivedClasses[cls];
                    card.className = `class-card ${isArrived ? 'arrived' : 'pending'}`;
                    card.innerText = cls;
                    rowDiv.appendChild(card);
                });

                container.appendChild(rowDiv);
            });
        }

        renderDisplay();

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                const statusRef = db.ref('dismissal/arrivedClasses');

                statusRef.on('value', (snapshot) => {
                    arrivedClasses = snapshot.val() || {};
                    renderDisplay();
                });
            }
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
        }
    </script>
</body>
</html>
