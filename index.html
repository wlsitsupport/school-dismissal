<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地下有蓋操場 - 放學班別即時顯示</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 95vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3.2rem;
            margin: 0;
            color: #facc15;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-top: 5px;
            font-weight: bold;
        }
        
        /* 5 行區域容器 */
        .rows-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 每行 Flex 排版 */
        .grade-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        /* 班別卡片基礎樣式 */
        .class-card {
            flex: 1;
            max-width: 220px;
            border-radius: 16px;
            padding: 20px 10px;
            font-size: 3.2rem;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }

        /* 未到達：暗灰色 */
        .class-card.pending {
            background-color: #1e293b;
            border: 3px solid #334155;
            color: #64748b;
            opacity: 0.5;
        }

        /* 已到達：高亮綠色 */
        .class-card.arrived {
            background: linear-gradient(145deg, #15803d, #22c55e);
            border: 3px solid #4ade80;
            color: #ffffff;
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>放學集合 — 地下有蓋操場</h1>
        <div class="subtitle">綠色代表班別已到達操場</div>
    </div>

    <div id="rowsContainer" class="rows-container"></div>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ⚠️ 請填入您的 firebaseConfig 金鑰
const firebaseConfig = {
  apiKey: "AIzaSyBSdMpO9W9iLYGdjeqpghx5M50EQriIIHE",
  authDomain: "school-dismissal-c4251.firebaseapp.com",
  databaseURL: "https://school-dismissal-c4251-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "school-dismissal-c4251",
  storageBucket: "school-dismissal-c4251.firebasestorage.app",
  messagingSenderId: "610659127496",
  appId: "1:610659127496:web:67b53b52ffa2183bf5d5fd",
  measurementId: "G-ET6JXWYSLN"
};

        // 按指定 5 行排列班別
        const classRows = [
            ["1信", "1望", "2信", "2望"],
            ["3信", "3望"],
            ["4信", "4望", "4愛"],
            ["5信", "5望", "5愛", "5勤"],
            ["6信", "6望", "6愛", "6勤"]
        ];

        let arrivedClasses = {};

        function renderDisplay() {
            const container = document.getElementById('rowsContainer');
            container.innerHTML = '';

            classRows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grade-row';

                row.forEach(cls => {
                    const card = document.createElement('div');
                    const isArrived = arrivedClasses[cls];
                    card.className = `class-card ${isArrived ? 'arrived' : 'pending'}`;
                    card.innerText = cls;
                    rowDiv.appendChild(card);
                });

                container.appendChild(rowDiv);
            });
        }

        renderDisplay();

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                const statusRef = db.ref('dismissal/arrivedClasses');

                statusRef.on('value', (snapshot) => {
                    arrivedClasses = snapshot.val() || {};
                    renderDisplay();
                });
            }
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
        }
    </script>
</body>
</html>
